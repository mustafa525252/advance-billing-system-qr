<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Distributor Registration | Advance Billing System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            background: #f4f6f9;
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #ecfdf5;
            color: #059669;
            font-size: 28px;
        }

        .header h1 {
            font-size: 26px;
            color: #1f2937;
        }

        .header p {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #059669;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .register-btn:hover {
            background: #047857;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #6b7280;
        }

        .login-link a {
            color: #059669;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .required {
            color: #dc2626;
        }

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        /* Error message */
        .message.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        /* Success message */
        .message.success {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        /* Warning message */
        .message.warning {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        /* Information message */
        .message.info {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        @media (max-width: 500px) {
            .register-container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="header">

            <div class="icon">
                👤
            </div>

            <h1>Distributor Registration</h1>

            <p>
                Create your distributor account
            </p>

        </div>

        <form method="POST" action="{% url 'distributor_register' %}">

            {% csrf_token %}
            {% if messages %}
            <div class="messages">

                {% for message in messages %}

                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>

                {% endfor %}

            </div>
            {% endif %}

            <div class="form-group">
                <label for="name">
                    Full Name <span class="required">*</span>
                </label>

                <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name"
                    minlength="3" pattern="[A-Za-z ]+" required>
            </div>

            <div class="form-group">
                <label for="email">
                    Email Address <span class="required">*</span>
                </label>

                <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="phone">
                    Phone Number <span class="required">*</span>
                </label>

                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" autocomplete="tel"
                    minlength="10" maxlength="10" pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label for="password">
                    Password <span class="required">*</span>
                </label>

                <input type="password" id="password" name="password" placeholder="Create a password"
                    autocomplete="new-password" minlength="8" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">
                    Confirm Password <span class="required">*</span>
                </label>

                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password"
                    autocomplete="new-password" minlength="8" required>
            </div>

            <button type="submit" class="register-btn">
                Create Distributor Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{% url 'distributor_login' %}">
                Distributor Login
            </a>
        </div>

    </div>
</body>

</html>
