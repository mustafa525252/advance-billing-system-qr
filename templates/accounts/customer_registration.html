<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f3f6fb;
            font-family: Arial, sans-serif;
            color: #243047;
        }

        .registration-card {
            max-width: 850px;
            margin: 45px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(31, 48, 75, 0.09);
            overflow: hidden;
        }

        .form-header {
            background: #1746a2;
            color: white;
            padding: 28px 32px;
        }

        .form-header h2 {
            margin: 0 0 8px;
            font-weight: 700;
        }

        .form-body {
            padding: 32px;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            min-height: 45px;
            border-radius: 8px;
            border-color: #d8dfeb;
        }

        .form-control:focus {
            border-color: #1746a2;
            box-shadow: 0 0 0 3px rgba(23, 70, 162, 0.1);
        }

        textarea.form-control {
            min-height: 95px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            margin: 10px 0 20px;
            color: #1746a2;
        }

        .btn-primary {
            background: #1746a2;
            border-color: #1746a2;
            padding: 11px 24px;
            border-radius: 8px;
        }

        .btn-primary:hover {
            background: #10357c;
            border-color: #10357c;
        }

        .btn-outline-secondary {
            padding: 11px 24px;
            border-radius: 8px;
        }

        @media (max-width: 576px) {
            .registration-card {
                margin: 15px;
            }

            .form-body {
                padding: 22px;
            }

            .form-header {
                padding: 24px 22px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="registration-card">

        <div class="form-header">
            <h2>Register Customer</h2>
            <p class="mb-0">
                Add customer details for billing and invoice management.
            </p>
        </div>

        <div class="form-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
                         role="alert">
                        {{ message }}
                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                                aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST"
                  action="{% url 'customer_register_api' %}">
                {% csrf_token %}

                <h5 class="section-title">Customer Information</h5>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">
                            Customer Name *
                        </label>
                        <input type="text"
                               class="form-control"
                               id="name"
                               name="name"
                               placeholder="Enter customer name"
                               maxlength="100"
                               autocomplete="name"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">
                            Email Address *
                        </label>
                        <input type="email"
                               class="form-control"
                               id="email"
                               name="email"
                               placeholder="customer@example.com"
                               maxlength="254"
                               autocomplete="email"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="phone" class="form-label">
                            Phone Number *
                        </label>
                        <input type="tel"
                               class="form-control"
                               id="phone"
                               name="phone"
                               placeholder="Enter phone number"
                               maxlength="15"
                               autocomplete="tel"
                               required>
                    </div>
                </div>

                <hr class="my-4">

                <h5 class="section-title">Billing Address</h5>

                <div class="row g-3">
                    <div class="col-12">
                        <label for="street_address" class="form-label">
                            Street Address *
                        </label>
                        <textarea class="form-control"
                                  id="street_address"
                                  name="street_address"
                                  placeholder="House number, street, area"
                                  autocomplete="street-address"
                                  required></textarea>
                    </div>

                    <div class="col-md-6">
                        <label for="city" class="form-label">City *</label>
                        <input type="text"
                               class="form-control"
                               id="city"
                               name="city"
                               placeholder="Enter city"
                               autocomplete="address-level2"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="state" class="form-label">State *</label>
                        <input type="text"
                               class="form-control"
                               id="state"
                               name="state"
                               placeholder="Enter state"
                               autocomplete="address-level1"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="pincode" class="form-label">
                            PIN Code *
                        </label>
                        <input type="text"
                               class="form-control"
                               id="pincode"
                               name="pincode"
                               placeholder="Enter PIN code"
                               inputmode="numeric"
                               maxlength="10"
                               autocomplete="postal-code"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="country" class="form-label">
                            Country
                        </label>
                        <input type="text"
                               class="form-control"
                               id="country"
                               name="country"
                               value="India"
                               autocomplete="country-name">
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex flex-wrap justify-content-end gap-2">
                    <button type="reset"
                            class="btn btn-outline-secondary">
                        Clear Form
                    </button>

                    <button type="submit" class="btn btn-primary">
                        Register Customer
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
