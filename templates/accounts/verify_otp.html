<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify OTP | Billing System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f9;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 42px;
            border-radius: 18px;
            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ecfdf5;
            color: #059669;

            border-radius: 15px;

            font-size: 27px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 25px;
            color: #111827;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .otp-input {
            width: 100%;
            height: 55px;

            text-align: center;

            letter-spacing: 10px;

            font-size: 24px;
            font-weight: 600;

            border: 1px solid #d1d5db;
            border-radius: 9px;

            outline: none;
        }

        .otp-input:focus {
            border-color: #059669;

            box-shadow:
                0 0 0 3px
                rgba(5, 150, 105, 0.10);
        }

        .verify-btn {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 9px;

            background: #059669;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        .verify-btn:hover {
            background: #047857;
        }

        .resend {
            text-align: center;
            margin-top: 20px;
        }

        .resend a {
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="icon">
            🔑
        </div>

        <div class="header">

            <h1>
                Verify OTP
            </h1>

            <p>
                Enter the 6-digit OTP sent to your
                registered email address.
            </p>

        </div>


        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <form
            method="POST"
            action="{% url 'verify_otp' %}"
        >

            {% csrf_token %}

            <div class="form-group">

                <label for="otp">
                    Verification Code
                </label>

                <input
                    type="text"
                    id="otp"
                    name="otp"
                    class="otp-input"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    placeholder="••••••"
                    required
                >

            </div>


            <button
                type="submit"
                class="verify-btn"
            >
                Verify OTP
            </button>

        </form>


        <div class="resend">

            <a href="{% url 'resend_otp' %}">
    Didn't receive the OTP? Resend
</a>

        </div>

    </div>

</body>

</html>
