<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Admin Panel | Advance Billing System
        {% endblock %}
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f6f9;
            color: #1f2937;
        }


        /* HEADER */

        .navbar {
            height: 70px;
            background: #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 45px;
            color: white;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
        }

        .brand span {
            color: #10b981;
        }


        /* NAVIGATION */

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav-links a:hover {
            background: #374151;
            color: white;
        }

        .nav-links .active {
            background: #059669;
            color: white;
        }

        .logout {
            margin-left: 10px;
            background: #374151;
        }

        .logout:hover {
            background: #dc2626 !important;
        }


        /* MAIN CONTENT */

        main {
            min-height: calc(100vh - 140px);
        }


        /* FOOTER */

        footer {
            background: #1f2937;
            color: #9ca3af;
            text-align: center;
            padding: 20px;
            font-size: 13px;
        }


        /* MOBILE */

        @media (max-width: 800px) {

            .navbar {
                height: auto;
                padding: 18px 20px;
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .nav-links {
                width: 100%;
                flex-wrap: wrap;
            }

            main {
                min-height: calc(100vh - 200px);
            }

        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>


<body>


    <!-- HEADER -->

    <nav class="navbar">

        <div class="brand">

            Advance Billing System
            <span>Admin</span>

        </div>


        <div class="nav-links">

            <a
                href="{% url 'admin_dashboard' %}"
            >
                Dashboard
            </a>

            <a
                href="#distributors"
            >
                Distributors
            </a>

            <a
                href="#customers"
            >
                Customers
            </a>

            <a
                href="#products"
            >
                Products
            </a>

            <a
                href="{% url 'logout' %}"
                class="logout"
            >
                Logout
            </a>

        </div>

    </nav>


    <!-- PAGE CONTENT -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- FOOTER -->

    <footer>

        © 2026 Advance Billing System.
        Admin Panel.

    </footer>


    {% block extra_js %}
    {% endblock %}


</body>

</html>
