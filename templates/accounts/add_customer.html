<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Customer | Advance Billing System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f6f9;
            color: #1f2937;
        }

        /* NAVBAR */

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar h2 {
            margin: 0;
            font-size: 20px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        /* PAGE */

        .container {
            width: 100%;
            max-width: 700px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
            font-size: 14px;
        }

        /* FORM CARD */

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 14px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .required {
            color: #dc2626;
        }

        .form-group input,
        .form-group textarea {

            width: 100%;
            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-size: 14px;
            outline: none;

            transition: 0.2s;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        .form-group input:focus,
        .form-group textarea:focus {

            border-color: #059669;

            box-shadow:
                0 0 0 3px
                rgba(5, 150, 105, 0.1);
        }

        /* BUTTONS */

        .form-actions {

            display: flex;
            justify-content: flex-end;
            gap: 12px;

            margin-top: 25px;
        }

        .btn {

            padding: 12px 20px;

            border-radius: 8px;
            border: none;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
            text-decoration: none;
        }

        .btn-cancel {

            background: #f3f4f6;
            color: #374151;
        }

        .btn-submit {

            background: #059669;
            color: white;
        }

        .btn-submit:hover {
            background: #047857;
        }
        /* =========================
   DJANGO MESSAGES
========================= */

.messages {
    margin-bottom: 20px;
}

.message {
    padding: 12px 14px;
    margin-bottom: 10px;

    border-radius: 8px;

    font-size: 14px;
    font-weight: 500;
}

.message.error {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
}

.message.success {
    background: #ecfdf5;
    color: #047857;
    border: 1px solid #a7f3d0;
}

        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;
            }

            .navbar h2 {
                font-size: 16px;
            }

            .container {
                margin-top: 30px;
            }

            .form-card {
                padding: 25px;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .btn {
                text-align: center;
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <div class="navbar">

        <h2>
            Advance Billing System
        </h2>

        <a href="{% url 'distributor_dashboard' %}">
            Dashboard
        </a>

    </div>


    <!-- PAGE -->

    <div class="container">


        <div class="page-header">

            <h1>
                Add New Customer
            </h1>

            <p>
                Enter customer information below.
            </p>

        </div>


        <!-- FORM -->

        <div class="form-card">

            <form
                method="POST"
                action="{% url 'add_customer' %}"
            >

                {% csrf_token %}
                {% if messages %}
    <div class="messages">

        {% for message in messages %}

            <div class="message {{ message.tags }}">
                {{ message }}
            </div>

        {% endfor %}

    </div>
{% endif %}


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">

                        Full Name
                        <span class="required">*</span>

                    </label>

                    <input
    type="text"
    id="name"
    name="name"
    placeholder="Enter customer name"
    minlength="3"
    pattern="[A-Za-z ]+"
    required
>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">

                        Email Address
                        <span class="required">*</span>

                    </label>

                    <input
    type="email"
    id="email"
    name="email"
    placeholder="Enter customer email"
    required
>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">

                        Phone Number
                        <span class="required">*</span>

                    </label>

                    <input
    type="tel"
    id="phone"
    name="phone"
    placeholder="Enter customer phone number"
    minlength="10"
    maxlength="10"
    pattern="[0-9]{10}"
    required
>

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label for="address">

                        Address
                        <span class="required">*</span>

                    </label>

                    <textarea
    id="address"
    name="address"
    placeholder="Enter customer address"
    minlength="5"
    required
></textarea>

                </div>


                <!-- BUTTONS -->

                <div class="form-actions">

                    <a
                        href="{% url 'distributor_dashboard' %}"
                        class="btn btn-cancel"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-submit"
                    >
                        Add Customer
                    </button>

                </div>


            </form>

        </div>


    </div>


</body>

</html>
