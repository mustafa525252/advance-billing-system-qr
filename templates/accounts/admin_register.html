<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .register-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .register-card h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
            font-size: 27px;
        }

        .register-card p.subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .register-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 25px 20px;
            }

            .register-card h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="register-card">

        <h1>Admin Registration</h1>

        <p class="subtitle">
            Create a new administrator account
        </p>

        <!-- API response message -->
        <div
            id="message"
            class="message"
            role="alert"
            aria-live="polite"
        ></div>

        <form id="adminRegisterForm">

            {% csrf_token %}

            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter full name"
                    minlength="3"
                    pattern="[A-Za-z ]+"
                    title="Enter at least 3 characters using letters and spaces only."
                    autocomplete="name"
                    required
                >
            </div>

            <!-- Username -->
            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    minlength="4"
                    maxlength="150"
                    pattern="[A-Za-z0-9_]+"
                    title="Use letters, numbers, and underscores only. Minimum 4 characters."
                    autocomplete="username"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    autocomplete="email"
                    required
                >
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="register-btn"
                id="registerButton"
            >
                Create Admin Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{% url 'admin_login' %}">Login</a>
        </div>

    </div>

</div>

<script>
    const form = document.getElementById('adminRegisterForm');
    const messageBox = document.getElementById('message');
    const registerButton = document.getElementById('registerButton');

    form.addEventListener('submit', async function (event) {
        event.preventDefault();

        // Read form values
        const name = document.getElementById('name').value.trim();
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword =
            document.getElementById('confirm_password').value;

        // Clear previous messages
        messageBox.className = 'message';
        messageBox.textContent = '';

        // Frontend validation
        if (name.length < 3) {
            showMessage('Please enter a name with at least 3 characters.', 'error');
            return;
        }

        if (!/^[A-Za-z ]+$/.test(name)) {
            showMessage('Name can contain only letters and spaces.', 'error');
            return;
        }

        if (username.length < 4 || !/^[A-Za-z0-9_]+$/.test(username)) {
            showMessage(
                'Username must contain at least 4 characters and use only letters, numbers, and underscores.',
                'error'
            );
            return;
        }

        if (password.length < 8) {
            showMessage('Password must contain at least 8 characters.', 'error');
            return;
        }

        if (!/[A-Za-z]/.test(password) || !/\d/.test(password)) {
            showMessage(
                'Password must contain at least one letter and one number.',
                'error'
            );
            return;
        }

        if (password !== confirmPassword) {
            showMessage('Passwords do not match.', 'error');
            return;
        }

        // Disable button while request is running
        registerButton.disabled = true;
        registerButton.textContent = 'Creating Account...';

        try {
            const csrfToken = document.querySelector(
                '[name=csrfmiddlewaretoken]'
            ).value;

            const response = await fetch(
                "{% url 'admin_register_api' %}",
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({
                        name: name,
                        username: username,
                        email: email,
                        password: password,
                        confirm_password: confirmPassword
                    })
                }
            );

            const data = await response.json();

            if (response.ok && data.success) {
                showMessage(
                    data.message || 'Admin registered successfully.',
                    'success'
                );

                form.reset();

                registerButton.textContent = 'Registration Successful';

                setTimeout(function () {
                    window.location.href = "{% url 'admin_login' %}";
                }, 1500);

            } else {
                showMessage(
                    data.message || 'Registration failed. Please try again.',
                    'error'
                );
            }

        } catch (error) {
            console.error('Registration error:', error);

            showMessage(
                'Unable to connect to the server. Please try again.',
                'error'
            );

        } finally {
            // Keep the button disabled during the success redirect.
            if (!messageBox.classList.contains('success')) {
                registerButton.disabled = false;
                registerButton.textContent = 'Create Admin Account';
            }
        }
    });

    function showMessage(message, type) {
        messageBox.className = 'message ' + type;
        messageBox.textContent = message;
    }
</script>

</body>
</html>
