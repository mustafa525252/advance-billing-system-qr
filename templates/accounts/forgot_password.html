<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Billing System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f9;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 42px;
            border-radius: 18px;
            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ecfdf5;
            color: #059669;

            border-radius: 15px;

            font-size: 28px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #111827;
            font-size: 25px;
            margin-bottom: 9px;
        }

        .header p {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;

            border: 1px solid #d1d5db;
            border-radius: 9px;

            outline: none;

            font-size: 14px;
        }

        input:focus {
            border-color: #059669;

            box-shadow:
                0 0 0 3px
                rgba(5, 150, 105, 0.10);
        }

        .submit-btn {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 9px;

            background: #059669;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        .submit-btn:hover {
            background: #047857;
        }

        .back {
            text-align: center;
            margin-top: 24px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="icon">
            🔐
        </div>

        <div class="header">

            <h1>
                Forgot Password?
            </h1>

            <p>
                Enter your registered email address
                and we'll send you a verification OTP.
            </p>

        </div>


        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <form
            method="POST"
            action="{% url 'forgot_password' %}"
        >

            {% csrf_token %}

            <div class="form-group">

                <label for="email">
                    Registered Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your Gmail address"
                    required
                >

            </div>

            <button
                type="submit"
                class="submit-btn"
            >
                Send OTP
            </button>

        </form>


        <div class="back">

            <a href="{% url 'distributor_login' %}">
                ← Back to Login
            </a>

        </div>

    </div>

</body>

</html>
